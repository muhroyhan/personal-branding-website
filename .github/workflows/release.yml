name: Release

# Fully automatic, no manual version input: semantic-release reads Conventional
# Commits (https://www.conventionalcommits.org) on every push to `main`,
# decides the next semver bump itself (fix -> patch, feat -> minor,
# "BREAKING CHANGE" / "!" -> major, anything else -> no release), then bumps
# package.json, updates CHANGELOG.md, tags the commit, and publishes a GitHub
# Release. See .releaserc.json for the pipeline and README "Versioning".
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
